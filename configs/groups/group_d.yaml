  rows: 2
  cols: 2
  module_count: 4
  layout_priority: preferred
  internal_spacing:
    horizontal_gap_m: 1.2
    vertical_gap_m: 0
  external_spacing:
    horizontal_gap_m: 1.2
    vertical_gap_m: 1
  arrangement:
  - row: 0
    col: 0
    rotation: 0
    mirror: none
  - row: 1
    col: 0
    rotation: 0
    mirror: vertical
  - row: 0
    col: 1
    rotation: 0
    mirror: horizontal
  - row: 1
    col: 1
    rotation: 0
    mirror: both
